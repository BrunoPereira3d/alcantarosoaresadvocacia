name: Publicar código-fonte estruturado

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair código do backup v5
        run: |
          set -euo pipefail
          mkdir -p /tmp/alcantaro-source
          unzip -q alcantaro-soares-advocacia-backup-2026-09-01-v5.zip -d /tmp/alcantaro-source
          rsync -a /tmp/alcantaro-source/source/ ./
          rm -f .github/workflows/expand-source.yml

      - name: Registrar estrutura navegável
        run: |
          git config user.name "BrunoPereira3d"
          git config user.email "418982637+BrunoPereira3d@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "Publica código-fonte estruturado"
          git push
