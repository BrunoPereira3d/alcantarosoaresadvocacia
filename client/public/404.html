<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5F0620" />
    <meta name="robots" content="noindex, follow" />
    <title>Página não encontrada — Alcântaro Soares Advocacia</title>
    <link rel="icon" type="image/webp" href="/assets/logo-sign.webp" />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/manrope-latin.woff2" crossorigin />
    <style>
      /* A página 404 é estática e não carrega o CSS da aplicação, por isso declara
         a própria @font-face para manter a tipografia institucional. */
      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url("/assets/fonts/manrope-latin.woff2") format("woff2-variations");
      }
      :root {
        --wine: #5f0620;
        --cream: #f8f3e9;
        --charcoal: #2a211d;
        --gold: #d8c08a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--charcoal);
        color: var(--cream);
        font-family: "Manrope", system-ui, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 34rem;
      }
      img {
        display: block;
        width: min(13rem, 100%);
        height: auto;
        margin: 0 auto 2.5rem;
      }
      p.code {
        margin: 0 0 1rem;
        color: var(--gold);
        font-size: 0.6rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 1rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.9rem, 5vw, 2.8rem);
        font-weight: 600;
        line-height: 1.15;
      }
      p.lead {
        margin: 0 0 2.5rem;
        color: rgba(248, 243, 233, 0.72);
        font-size: 1rem;
        line-height: 1.65;
      }
      a.button {
        display: inline-block;
        padding: 0.95rem 1.9rem;
        border-radius: 999px;
        background: var(--cream);
        color: var(--wine);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        transition:
          background 240ms ease,
          transform 240ms ease;
      }
      a.button:hover {
        background: var(--gold);
        transform: translateY(-2px);
      }
      a.button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/assets/logo-horizontal-fundo-escuro.webp"
        alt="Alcântaro Soares Advocacia"
        width="2400"
        height="795"
      />
      <p class="code">Erro 404</p>
      <h1>Esta página não foi encontrada.</h1>
      <p class="lead">
        O endereço acessado não existe ou foi alterado. Você pode voltar à
        página institucional para conhecer nossas frentes de atuação e os canais
        de contato.
      </p>
      <a class="button" href="/">Voltar ao início</a>
    </main>
  </body>
</html>
